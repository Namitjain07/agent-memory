<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Brain/memory icon -->
  <g transform="translate(80, 80)" filter="url(#glow)">
    <circle cx="80" cy="80" r="80" fill="url(#accent)" opacity="0.2"/>
    <text x="80" y="115" font-family="system-ui, -apple-system, sans-serif"
          font-size="100" text-anchor="middle" fill="white">🧠</text>
  </g>

  <!-- Title -->
  <text x="280" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="92" font-weight="800" fill="white">agent-memory</text>

  <!-- Subtitle gradient bar -->
  <rect x="280" y="195" width="160" height="6" fill="url(#accent)" rx="3"/>

  <!-- Tagline -->
  <text x="280" y="270" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="34" font-weight="600" fill="#e9d5ff">Persistent long-term memory for LLM agents</text>
  <text x="280" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="28" fill="#cbd5e1">Hybrid search · Multi-tier · Encryption · Zero deps</text>

  <!-- Feature chips -->
  <g transform="translate(280, 380)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="180" height="48" rx="24" fill="url(#chip)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="90" y="31" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="white" text-anchor="middle">🧠 3-layer memory</text>

    <!-- Chip 2 -->
    <rect x="200" y="0" width="180" height="48" rx="24" fill="url(#chip)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="290" y="31" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="white" text-anchor="middle">🔍 Hybrid search</text>

    <!-- Chip 3 -->
    <rect x="400" y="0" width="180" height="48" rx="24" fill="url(#chip)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490" y="31" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="white" text-anchor="middle">👥 Multi-tier</text>

    <!-- Chip 4 -->
    <rect x="600" y="0" width="180" height="48" rx="24" fill="url(#chip)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="690" y="31" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="white" text-anchor="middle">🔐 Encryption</text>

    <!-- Chip 5 -->
    <rect x="800" y="0" width="180" height="48" rx="24" fill="url(#chip)" stroke="#10b981" stroke-width="1.5"/>
    <text x="890" y="31" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="white" text-anchor="middle">⚡ Zero deps</text>
  </g>

  <!-- Works-with row -->
  <text x="280" y="500" font-family="system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="700" fill="#94a3b8">WORKS WITH</text>
  <text x="280" y="535" font-family="system-ui, -apple-system, sans-serif"
        font-size="22" fill="#e2e8f0">OpenAI · Anthropic · Gemini · Mistral · Cohere · Voyage · Ollama · Vercel AI SDK</text>

  <!-- Footer badge -->
  <g transform="translate(990, 80)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="url(#chip)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="110" y="31" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="600" fill="white" text-anchor="middle">MIT · TypeScript · v0.5.0</text>
  </g>
</svg>
