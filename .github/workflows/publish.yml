name: Publish to npm

# Triggers on any tag push matching v* (e.g. v0.3.0, v1.0.0)
# Also works when you manually create a GitHub Release.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.5.0). Leave blank to use the tag that triggered this run."
        required: false

# OIDC: grants this workflow permission to request a short-lived
# npm publish token without storing any long-lived secret.
permissions:
  contents: read
  id-token: write # required for npm OIDC Trusted Publisher

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (so peer deps resolve)
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm test

      - name: Lint
        run: npx prettier --check . && npx eslint . --max-warnings 0

  publish:
    name: Publish packages
    runs-on: ubuntu-24.04
    needs: test
    # Optional: tie to a GitHub Actions environment for extra approval controls.
    # Create an environment called "npm-publish" in Settings → Environments.
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build all packages
        run: npm run build --workspaces --if-present

      # ── Authentication ──────────────────────────────────────────────────
      # Use a manual npm token (NPM_TOKEN secret) if one is set;
      # otherwise fall back to OIDC trusted publishing.
      #
      # Why both? The OIDC path is "modern" but requires you to register
      # the trusted publisher on npmjs.com for each of the 6 packages
      # (one-time setup). The token path works immediately if you have an
      # `NPM_TOKEN` secret set, but is less secure (long-lived credential).
      - name: Configure npm auth (token if present, else OIDC)
        shell: bash
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"
            echo "→ using NPM_TOKEN secret"
          else
            echo "→ using OIDC trusted publishing"
          fi

      # ── Publish in dependency order ────────────────────────────────────
      # Core first (other packages depend on it for types).
      # All 6 packages must already be registered as trusted publishers
      # on npmjs.com OR the same NPM_TOKEN must have publish permission
      # for all 6.
      - name: Publish @namitjain.india/agent-memory
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @namitjain.india/agent-memory-sqlite
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-sqlite
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @namitjain.india/agent-memory-postgres
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-postgres
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @namitjain.india/agent-memory-react
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @namitjain.india/agent-memory-vercel
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-vercel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @namitjain.india/agent-memory-cli
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
