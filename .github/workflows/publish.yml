name: Publish to npm

# Triggers on any tag push matching v* (e.g. v0.3.0, v1.0.0)
# Also works when you manually create a GitHub Release.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

# OIDC: grants this workflow permission to request a short-lived
# npm publish token without storing any long-lived secret.
permissions:
  contents: read
  id-token: write # required for npm OIDC Trusted Publisher

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (so peer deps resolve)
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm test

      - name: Lint
        run: npx prettier --check . && npx eslint . --max-warnings 0

  publish:
    name: Publish packages
    runs-on: ubuntu-24.04
    needs: test
    # Optional: tie to a GitHub Actions environment for extra approval controls.
    # Create an environment called "npm-publish" in Settings → Environments.
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build all packages
        run: npm run build --workspaces --if-present

      # Publish core package first (adapters depend on it for types)
      - name: Publish @namitjain.india/agent-memory
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory

      - name: Publish @namitjain.india/agent-memory-sqlite
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-sqlite

      - name: Publish @namitjain.india/agent-memory-postgres
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-postgres

      - name: Publish @namitjain.india/agent-memory-react
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-react

      - name: Publish @namitjain.india/agent-memory-vercel
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-vercel

      - name: Publish @namitjain.india/agent-memory-cli
        run: npm publish --access public --provenance
        working-directory: packages/agent-memory-cli
