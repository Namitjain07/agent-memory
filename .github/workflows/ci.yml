name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to the most-restrictive permission set; jobs override as needed.
permissions:
  contents: read

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier check
        run: npx prettier --check .

      - name: ESLint
        run: npx eslint . --max-warnings 0

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build first so peer-dep types (e.g. @namitjain.india/agent-memory)
      # resolve from the locally-built dist/ folder.
      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Typecheck core
        run: npx tsc --noEmit -p packages/agent-memory

      - name: Typecheck sqlite
        run: npx tsc --noEmit -p packages/agent-memory-sqlite

      - name: Typecheck postgres
        run: npx tsc --noEmit -p packages/agent-memory-postgres

      - name: Typecheck react
        run: npx tsc --noEmit -p packages/agent-memory-react

      - name: Typecheck vercel
        run: npx tsc --noEmit -p packages/agent-memory-vercel

      - name: Typecheck cli
        run: npx tsc --noEmit -p packages/agent-memory-cli

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build packages
        run: npm run build --workspaces --if-present

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      # Node 18 EOL April 2025; better-sqlite3 12+ requires Node 20+; 13+ requires Node 22+.
      matrix:
        node-version: ["20", "22"]
      fail-fast: false
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (so peer deps resolve)
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm test

  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    # Run benchmarks on both PRs and main pushes so we get a regression
    # baseline whenever the merge lands. Benchmarks are read-only so they
    # are safe to run on every commit.
    if: "!contains(github.event.head_commit.message, '[skip bench]')"
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (so benchmarks can import the dist)
        run: npm run build --workspaces --if-present

      - name: Run benchmarks
        # The bench file is at the repo root (benchmarks/recall.bench.ts),
        # not inside packages/agent-memory. Run from the root with
        # --passWithNoTests for resilience (no app code means no .test.ts
        # files in the root, but vitest expects to find at least one).
        run: npx vitest bench --run --reporter=default
