name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Prettier check
        run: npx prettier --check .
      - name: ESLint
        run: npx eslint . --max-warnings 0

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      # Build first so peer-dep types (e.g. @namitjain.india/agent-memory)
      # resolve from the locally-built dist/ folder.
      - run: npm run build --workspaces --if-present
      - run: npx tsc --noEmit -p packages/agent-memory
      - run: npx tsc --noEmit -p packages/agent-memory-sqlite
      - run: npx tsc --noEmit -p packages/agent-memory-postgres
      - run: npx tsc --noEmit -p packages/agent-memory-react
      - run: npx tsc --noEmit -p packages/agent-memory-vercel
      - run: npx tsc --noEmit -p packages/agent-memory-cli

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run build --workspaces --if-present

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      # Node 18 EOL April 2025; better-sqlite3 12+ requires Node 20+; 13+ requires Node 22+.
      matrix:
        node-version: ["20", "22"]
      fail-fast: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build (so peer deps resolve)
        run: npm run build --workspaces --if-present
      - name: Run tests
        run: npm test

  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    # Run benchmarks on both PRs and main pushes so we get a regression
    # baseline whenever the merge lands. Benchmarks are read-only so they
    # are safe to run on every commit.
    if: "!contains(github.event.head_commit.message, '[skip bench]')"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - run: npm run build --workspaces --if-present
      - run: cd packages/agent-memory && npx vitest bench --run --reporter=default
