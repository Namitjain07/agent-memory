name: Feature request
description: Suggest an idea or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What limitation or pain point are you facing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API/behavior you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: package
    attributes:
      label: Relevant package
      options:
        - "@namitjain07/agent-memory"
        - "@namitjain07/agent-memory-sqlite"
        - "@namitjain07/agent-memory-postgres"
        - "@namitjain07/agent-memory-react"
        - "Multiple / cross-package"
    validations:
      required: true
